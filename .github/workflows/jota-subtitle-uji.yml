# Uji subtitle Whisper pada satu video (URL MP4), hasil ke Drive "Video JOTA/UJI-SUBTITLE/".
name: jota-subtitle-uji
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL MP4'
        required: true
      nama:
        description: 'nama file tanpa .mp4'
        required: true
        default: 'UJI-SUBTITLE'
      judul:
        description: 'kotak judul (opsional)'
        required: false
        default: ''
defaults:
  run:
    # Repo publik: ID file Drive dan video YouTube disamarkan di log.
    shell: bash -o pipefail -c "bash --noprofile --norc -eo pipefail {0} 2>&1 | sed -u -E 's#(/d/|shorts/|youtu[.]be/|[?&]id=)[A-Za-z0-9_-]{{10,}}#\1***#g'"
jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOTA_DRIVE_URL: ${{ secrets.JOTA_DRIVE_URL }}
      JOTA_DRIVE_ROOT: uji
    defaults:
      run:
        shell: bash -o pipefail -c "bash --noprofile --norc -eo pipefail {0} 2>&1 | sed -u -E 's#(/d/|shorts/|youtu[.]be/|[?&]id=)[A-Za-z0-9_-]{{10,}}#\1***#g'"
        working-directory: apps/videoexpress-runner
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ohan78/Jota_Content_Factory
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - timeout-minutes: 10
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg </dev/null >/dev/null && pip install -q faster-whisper >/dev/null
      - run: |
          mkdir -p out && curl -sSL -o "out/${{ inputs.nama }}.mp4" "${{ inputs.url }}"
          JOTA_TITLE="${{ inputs.judul }}" python3 subtitle.py "out/${{ inputs.nama }}.mp4"
          cat "out/${{ inputs.nama }}.srt"
          node upload-drive.mjs out UJI-SUBTITLE

# Coba satu kalimat dengan suara tokoh (characters/suara.json), hasil ke Drive "Video JOTA/_COBA-KALIMAT/".
name: jota-coba-kalimat
on:
  workflow_dispatch:
    inputs:
      tokoh: { description: 'UWAIS, ABA, NARATOR, ...', required: true }
      kalimat: { description: 'kalimat', required: true }
defaults:
  run:
    # Repo publik: ID file Drive dan video YouTube disamarkan di log.
    shell: bash -o pipefail -c "bash --noprofile --norc -eo pipefail {0} 2>&1 | sed -u -E 's#(/d/|shorts/|youtu[.]be/|[?&]id=)[A-Za-z0-9_-]{{10,}}#\1***#g'"
jobs:
  coba:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      JOTA_DRIVE_URL: ${{ secrets.JOTA_DRIVE_URL }}
      JOTA_DRIVE_ROOT: uji
      TOKOH: ${{ inputs.tokoh }}
      KALIMAT: ${{ inputs.kalimat }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ohan78/Jota_Content_Factory
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - timeout-minutes: 10
        run: |
          # apt di runner kadang macet (2026-11-06 run 42114419455): coba apt 4 menit, kalau gagal pakai ffmpeg statis.
          command -v ffprobe >/dev/null && exit 0
          timeout 240 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg </dev/null >/dev/null && exit 0
          echo "apt gagal; unduh ffmpeg statis"
          curl -sSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ff.tar.xz
          mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          sudo cp /tmp/ff/ffmpeg /tmp/ff/ffprobe /usr/local/bin/ && ffprobe -version | head -1
      - run: node apps/videoexpress-runner/coba-kalimat.mjs "$TOKOH" /tmp/co "$KALIMAT" && node apps/videoexpress-runner/upload-drive.mjs /tmp/co _COBA-KALIMAT

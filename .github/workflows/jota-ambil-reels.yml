# Ambil video Reels/Shorts publik untuk dipelajari gayanya (bukan untuk diunggah ulang). Hasil: artifact "reels".
name: jota-ambil-reels
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'link Reels/Shorts publik'
        required: true
permissions:
  contents: read
jobs:
  ambil:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Unduh
        env:
          URL: ${{ inputs.url }}
        run: |
          pip install -q -U yt-dlp
          mkdir -p out
          yt-dlp --no-playlist -f "b[ext=mp4]/b" -o "out/reels.%(ext)s" --write-info-json "$URL" || yt-dlp --no-playlist -o "out/reels.%(ext)s" --write-info-json "$URL"
          ls -la out
      - name: Simpan ke rilis privat studi-reels
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          R=ohan78/Jota_Content_Factory
          gh release view studi-reels -R $R >/dev/null 2>&1 || gh release create studi-reels -R $R --title "Studi gaya Reels (privat)" --notes "Bahan studi gaya, bukan untuk diunggah ulang" --prerelease
          gh release upload studi-reels -R $R out/reels.mp4 out/reels.info.json --clobber

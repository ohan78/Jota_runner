# Contoh suara emosi Uwais (penutur asli + eleven_v3) dari pustaka ElevenLabs, ke Drive "Video JOTA/_COBA-EMOSI-UWAIS/".
name: jota-coba-emosi
on:
  workflow_dispatch:
    inputs:
      jumlah: { description: 'jumlah kandidat', required: false, default: '5' }
defaults:
  run:
    # Repo publik: ID file Drive dan video YouTube disamarkan di log.
    shell: bash -o pipefail -c "bash --noprofile --norc -eo pipefail {0} 2>&1 | sed -u -E 's#(/d/|shorts/|youtu[.]be/|[?&]id=)[A-Za-z0-9_-]{{10,}}#\1***#g'"
jobs:
  coba:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      JOTA_DRIVE_URL: ${{ secrets.JOTA_DRIVE_URL }}
      JOTA_DRIVE_ROOT: uji
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ohan78/Jota_Content_Factory
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node apps/videoexpress-runner/coba-emosi.mjs /tmp/co "${{ inputs.jumlah }}" && node apps/videoexpress-runner/upload-drive.mjs /tmp/co _COBA-EMOSI-UWAIS

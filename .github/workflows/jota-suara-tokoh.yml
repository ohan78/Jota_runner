# Contoh suara tiap tokoh keluarga Uwais (ElevenLabs + naik nada), ke Drive "Video JOTA/_SUARA-TOKOH/".
name: jota-suara-tokoh
on: workflow_dispatch
defaults:
  run:
    # Repo publik: ID file Drive dan video YouTube disamarkan di log.
    shell: bash -o pipefail -c "bash --noprofile --norc -eo pipefail {0} 2>&1 | sed -u -E 's#(/d/|shorts/|youtu[.]be/|[?&]id=)[A-Za-z0-9_-]{{10,}}#\1***#g'"
jobs:
  suara:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      JOTA_DRIVE_URL: ${{ secrets.JOTA_DRIVE_URL }}
      JOTA_DRIVE_ROOT: uji
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ohan78/Jota_Content_Factory
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - timeout-minutes: 10
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg </dev/null >/dev/null
      - run: node apps/videoexpress-runner/suara-tokoh.mjs /tmp/st && node apps/videoexpress-runner/upload-drive.mjs /tmp/st _SUARA-TOKOH
